<!DOCTYPE html>
<html lang="en" data-accent="blue" data-mode="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b1017" id="tcolor" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/xchat-192.png" />
<title>XChat Messenger</title>
<style>
/* ============ THEME ENGINE ============ */
:root{
  --radius:22px; --nav-h:74px; --ease:cubic-bezier(.22,1,.36,1);
  --ok:#2ecf7d; --warn:#f0a12e; --bad:#e0556a;
}
html[data-accent="blue"]  {--a:#2f7cf6;--a2:#5c9bff;--a3:#1b58c4;--tint:216 96%}
html[data-accent="green"] {--a:#22a86b;--a2:#43c98a;--a3:#137a4b;--tint:156 60%}
html[data-accent="red"]   {--a:#e0556a;--a2:#f2808f;--a3:#b23448;--tint:350 70%}
html[data-accent="grey"]  {--a:#67748c;--a2:#8c99ad;--a3:#44506a;--tint:220 18%}
html[data-accent="pink"]  {--a:#e05fa8;--a2:#f286c3;--a3:#b03b7f;--tint:325 70%}
html[data-accent="orange"]{--a:#ef8b3c;--a2:#ffab63;--a3:#c26520;--tint:28 85%}

html[data-mode="light"]{
  --bg:#eff1f5; --bg2:#f6f8fb; --surface:#f2f4f8;
  --text:#0f1626; --muted:#8b95a8; --line:rgba(15,22,38,.07);
  --sh-dark:rgba(174,183,199,.55); --sh-light:rgba(255,255,255,.98);
  --glass:rgba(255,255,255,.62); --glass-b:rgba(255,255,255,.7);
  --bubble-you:#e9ecf3; --ph:#aeb7c6;
  --edge:color-mix(in srgb, var(--a) 42%, transparent);
  --edge-soft:color-mix(in srgb, var(--a) 22%, transparent);
  --halo1:#ffffff; --halo2:color-mix(in srgb, var(--a) 9%, #ffffff);
}
html[data-mode="dark"]{
  --bg:#080b12; --bg2:#0e131c; --surface:#111722;
  --text:#eef2fa; --muted:#8492a8; --line:rgba(255,255,255,.06);
  --sh-dark:rgba(0,0,0,.7); --sh-light:rgba(255,255,255,.035);
  --glass:rgba(14,19,28,.66); --glass-b:rgba(255,255,255,.06);
  --bubble-you:#161d29; --ph:#63718a;
  --edge:color-mix(in srgb, var(--a) 55%, transparent);
  --edge-soft:color-mix(in srgb, var(--a) 30%, transparent);
  --halo1:#101725; --halo2:color-mix(in srgb, var(--a) 13%, #080b12);
}
/* thin theme edging */
.edge{border:1px solid var(--edge-soft)}
.edge-strong{border:1px solid var(--edge)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  background:radial-gradient(1100px 600px at 10% -10%, var(--halo1) 0%, transparent 60%),
             radial-gradient(900px 700px at 110% 10%, var(--halo2) 0%, transparent 60%), var(--bg);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  transition:background .35s var(--ease), color .35s var(--ease);
  user-select:none;
}
input,textarea{user-select:text}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.hide{display:none !important}
.app{position:relative;height:100dvh;width:100%;max-width:520px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column}
/* neumorphic helpers */
.raised{background:var(--surface);box-shadow:7px 7px 16px var(--sh-dark), -7px -7px 16px var(--sh-light);border-radius:var(--radius)}
.inset{background:var(--surface);box-shadow:inset 4px 4px 9px var(--sh-dark), inset -4px -4px 9px var(--sh-light);border-radius:18px}
/* verified badge */
.vbadge{display:inline-flex;vertical-align:-2px;flex:none}
/* tappable entity in message text */
.ent{text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-weight:600}
/* hide Lovable badge everywhere */
#lovable-badge,#lovable-badge-wrapper,[id^="lovable-badge"],a[href*="lovable.dev"]{display:none !important;visibility:hidden !important;opacity:0 !important;pointer-events:none !important}
.glass{background:var(--glass);backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%);border:1px solid var(--glass-b)}
.press{transition:transform .16s var(--ease), box-shadow .16s var(--ease)}
.press:active{transform:scale(.96)}
.btn{border-radius:16px;padding:15px 18px;font-weight:600;letter-spacing:.2px;
  background:linear-gradient(135deg,var(--a2),var(--a));color:#fff;
  box-shadow:0 10px 22px color-mix(in srgb,var(--a) 34%,transparent), inset 0 1px 0 rgba(255,255,255,.3);
  width:100%;transition:transform .16s var(--ease),box-shadow .2s var(--ease)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.ghost{background:var(--surface);color:var(--text);box-shadow:5px 5px 12px var(--sh-dark),-5px -5px 12px var(--sh-light)}
.btn.danger{background:linear-gradient(135deg,#f2808f,#e0556a);box-shadow:0 10px 22px rgba(224,85,106,.3)}
.field{display:block;margin:12px 0}
.field>label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 7px 6px;font-weight:600}
.field .inset{display:flex;align-items:center;gap:10px;padding:0 14px}
.field input,.field textarea{flex:1;border:0;background:transparent;outline:none;padding:15px 0;font-size:15px}
.field input::placeholder{color:var(--ph)}
h1,h2,h3{margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px}
.err{font-size:12.5px;color:var(--bad);min-height:18px;margin:2px 6px}
.brand-foot{text-align:center;font-size:10.5px;letter-spacing:.5px;color:var(--muted);padding:8px 0 6px;opacity:.8}
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;contain:paint;will-change:scroll-position}
.scroll::-webkit-scrollbar{width:0}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 22%,var(--surface)),var(--surface));display:grid;place-items:center;font-weight:700;color:var(--a3);flex:none;box-shadow:3px 3px 8px var(--sh-dark),-3px -3px 8px var(--sh-light)}
.avatar.sm{width:38px;height:38px;font-size:13px}
.avatar.ring-on{box-shadow:0 0 0 2.5px var(--ok),0 0 0 5px var(--surface),3px 3px 8px var(--sh-dark),-3px -3px 8px var(--sh-light)}
.avatar.ring-off{box-shadow:0 0 0 2.5px var(--bad),0 0 0 5px var(--surface),3px 3px 8px var(--sh-dark),-3px -3px 8px var(--sh-light)}
.dot-online{width:12px;height:12px;border-radius:50%;background:var(--ok);border:2.5px solid var(--surface);position:absolute;right:-1px;bottom:-1px}
.pview{position:absolute;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 90%,#000);backdrop-filter:blur(16px);display:flex;flex-direction:column;animation:fade .22s var(--ease) both}
.pv-top{display:flex;align-items:center;gap:12px;padding:14px 14px 10px}
.pv-body{flex:1;display:grid;place-items:center;padding:10px 18px 34px}
.pv-body img{max-width:100%;max-height:100%;border-radius:26px;box-shadow:0 26px 60px rgba(0,0,0,.45);animation:scaleIn .26s var(--ease) both}
.pv-ini{width:min(74vw,300px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:74px;font-weight:800;color:#2a3550;animation:scaleIn .26s var(--ease) both}
.dot-off{width:12px;height:12px;border-radius:50%;background:var(--muted);opacity:.6;border:2.5px solid var(--surface);position:absolute;right:-1px;bottom:-1px}
/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:fadeUp .2s var(--ease) both;contain:layout paint;backface-visibility:hidden}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
.screen.slide{animation:slideIn .22s var(--ease) both}
@keyframes slideIn{from{opacity:.55;transform:translate3d(20px,0,0)}to{opacity:1;transform:none}}
.tabfade{animation:fadeUp .16s var(--ease) both}
.pad{padding:22px}
/* animated splash: plays once, fades out, then the app is live underneath */
#splash{position:fixed;inset:0;z-index:9999;background:#f8f9fa;display:grid;place-items:center;overflow:hidden;
  transition:opacity .38s var(--ease)}
#splash.gone{opacity:0;pointer-events:none}
#splash .anim{width:100%;height:100%}
#splash .fb{display:none;flex-direction:column;align-items:center;gap:18px}
#splash.fallback .anim{display:none}
#splash.fallback .fb{display:flex;animation:fadeUp .4s var(--ease) both}
#splash .fb span{font-size:17px;font-weight:800;color:#0b3d91;letter-spacing:.4px}

@keyframes brandFade{0%,18%{opacity:0;transform:translateY(8px)}32%,72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
/* topbar */
.topbar{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px}
.topbar h2{font-size:22px;font-weight:800;letter-spacing:.3px}
.iconbtn{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--edge-soft);
  box-shadow:4px 4px 10px var(--sh-dark),-4px -4px 10px var(--sh-light);transition:transform .15s var(--ease)}
.iconbtn:active{transform:scale(.92);box-shadow:inset 3px 3px 7px var(--sh-dark),inset -3px -3px 7px var(--sh-light)}
.searchbar{margin:2px 18px 12px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:30px !important;border:1px solid var(--edge)}
.searchbar input{flex:1;border:0;background:transparent;outline:none;padding:13px 0;font-size:14.5px}
/* rows */
.list{padding:4px 14px calc(var(--nav-h) + 46px);contain:layout paint}
.row{content-visibility:auto;contain-intrinsic-size:auto 74px;position:relative;display:flex;align-items:center;gap:13px;padding:12px 14px;margin:9px 0;border-radius:22px;background:var(--surface);border:1px solid var(--line);
  box-shadow:6px 6px 16px var(--sh-dark),-6px -6px 16px var(--sh-light);transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .2s}
.row.pressing{transform:scale(.955);border-color:var(--edge);box-shadow:inset 4px 4px 12px var(--sh-dark),inset -4px -4px 12px var(--sh-light)}
.row.pressing::after{content:"";position:absolute;inset:0;border-radius:22px;box-shadow:0 0 0 0 var(--edge-soft);animation:pressPulse .5s var(--ease) forwards}
@keyframes pressPulse{to{box-shadow:0 0 0 6px transparent}}
.row:active{transform:scale(.985);box-shadow:inset 3px 3px 9px var(--sh-dark),inset -3px -3px 9px var(--sh-light)}
.row .meta{flex:1;min-width:0}
.row .name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.row .last{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.time{font-size:11px;color:var(--muted)}
.badge{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:linear-gradient(135deg,var(--a2),var(--a));color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.skel{height:74px;border-radius:20px;margin:9px 0;background:linear-gradient(100deg,var(--surface) 30%,color-mix(in srgb,var(--a) 8%,var(--surface)) 50%,var(--surface) 70%);background-size:220% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-220% 0}}
/* nav dock */
.nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);
  width:min(92%,430px);height:var(--nav-h);border-radius:26px;display:flex;align-items:center;justify-content:space-around;
  z-index:20;border:1px solid var(--edge);box-shadow:0 16px 34px rgba(8,12,22,.22), inset 0 1px 0 var(--glass-b)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);
  padding:8px 14px;border-radius:18px;transition:color .22s var(--ease),transform .22s var(--ease)}
.nav button.active{color:var(--a3);transform:translateY(-2px)}
html[data-mode="dark"] .nav button.active{color:var(--a2)}
.nav button.active .navdot{opacity:1;transform:scale(1)}
.navdot{position:absolute;bottom:-1px;width:18px;height:3px;border-radius:3px;background:var(--a);opacity:0;transform:scale(.4);transition:.25s var(--ease)}
.nav button:active{transform:scale(.9)}
/* chat */
.chat-head{display:flex;align-items:center;gap:11px;padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;
  border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);z-index:5;contain:paint}
.msgs{flex:1;padding:14px 14px 8px;display:flex;flex-direction:column;gap:7px;position:relative}
.daysep{align-self:center;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface);padding:5px 12px;border-radius:12px;margin:6px 0;box-shadow:3px 3px 8px var(--sh-dark),-3px -3px 8px var(--sh-light)}
.bwrap{display:flex;flex-direction:column;max-width:78%;animation:bubIn .2s var(--ease) both;contain:layout paint}
.bwrap.me{align-self:flex-end;align-items:flex-end}.bwrap.you{align-self:flex-start;align-items:flex-start}
@keyframes bubIn{from{opacity:0;transform:translate3d(0,6px,0) scale(.975)}to{opacity:1;transform:none}}
.bub{padding:8px 12px 7px;border-radius:20px;font-size:14.5px;line-height:1.42;position:relative;word-break:break-word;white-space:pre-wrap}
.bwrap.me .bub{background:linear-gradient(135deg,var(--a2),var(--a));color:#fff;border-bottom-right-radius:7px;box-shadow:0 8px 18px color-mix(in srgb,var(--a) 30%,transparent)}
.bwrap.you .bub{background:var(--bubble-you);border-bottom-left-radius:7px;box-shadow:4px 4px 11px var(--sh-dark),-4px -4px 11px var(--sh-light)}
.bub.sel{outline:2px solid var(--a);outline-offset:2px}
.bwrap.pressing .bub{transform:scale(.94);filter:brightness(.96);box-shadow:0 0 0 2px var(--edge)}
.bwrap .bub{transition:transform .18s var(--ease),box-shadow .18s var(--ease),filter .18s var(--ease)}
.bub a{color:inherit}
.bmeta{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:10.5px;opacity:.85;transform:translateY(2px);white-space:nowrap}
.bub:not(.inline) .bmeta{display:flex;justify-content:flex-end;margin:1px 0 0}
.delmsg{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:800;color:#050505 !important;opacity:1;pointer-events:none}
.bwrap.me .delmsg{color:#050505 !important}
.call-screen{position:absolute;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 42px) 24px calc(env(safe-area-inset-bottom) + 34px);background:linear-gradient(160deg,var(--bg2),color-mix(in srgb,var(--a) 18%,var(--bg)));backdrop-filter:blur(26px);animation:fade .22s ease both}
.call-avatar{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;font-size:38px;box-shadow:0 0 0 5px var(--edge),0 0 0 13px color-mix(in srgb,var(--a) 12%,transparent),10px 18px 38px var(--sh-dark);animation:callPulse 2s ease-in-out infinite}
@keyframes callPulse{0%{box-shadow:0 0 0 0 rgba(45,190,110,.55)}70%{box-shadow:0 0 0 18px rgba(45,190,110,0)}100%{box-shadow:0 0 0 0 rgba(45,190,110,0)}}
.call-actions{display:flex;align-items:center;justify-content:center;gap:22px;width:100%}.call-action{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:6px 6px 15px var(--sh-dark),-6px -6px 15px var(--sh-light)}.call-action.on{background:var(--a);color:#fff}.call-action.end{background:var(--bad);color:#fff;transform:rotate(135deg)}.call-action.answer{background:var(--ok);color:#fff;animation:callPulse 1.6s ease-in-out infinite}.call-action.big{width:70px;height:70px}
.admin-user{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.bwrap.you .bmeta{color:var(--muted)}
.quote{border-left:3px solid currentColor;padding:5px 9px;margin:0 0 6px;border-radius:9px;font-size:12.5px;opacity:.82;background:rgba(127,127,127,.14);cursor:pointer}
.quote b{display:block;font-size:11.5px;margin-bottom:1px}
.reacts{display:flex;gap:4px;margin-top:-6px;z-index:2}
.reacts span{background:var(--surface);border-radius:11px;padding:2px 7px;font-size:12px;box-shadow:2px 2px 6px var(--sh-dark),-2px -2px 6px var(--sh-light);animation:pop .4s var(--ease) both}
.spin{width:11px;height:11px;border-radius:50%;border:1.6px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{display:inline-block;vertical-align:-1px}
.typing{align-self:flex-start;display:flex;align-items:flex-end;gap:5px;padding:13px 15px;border-radius:20px;background:var(--surface);box-shadow:4px 4px 11px var(--sh-dark),-4px -4px 11px var(--sh-light);animation:bubIn .18s var(--ease) both}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--a);opacity:.55;will-change:transform,opacity;animation:typedot 1.15s cubic-bezier(.36,.06,.2,1) infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes typedot{0%,64%,100%{transform:translate3d(0,0,0) scale(1);opacity:.42}28%{transform:translate3d(0,-6px,0) scale(1.18);opacity:1}}
@keyframes bounce{0%,64%,100%{transform:translate3d(0,0,0);opacity:.42}28%{transform:translate3d(0,-6px,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation-duration:2.4s}}
.newpill{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:9;padding:9px 15px;border-radius:16px;font-size:12.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a2),var(--a));box-shadow:0 8px 20px color-mix(in srgb,var(--a) 40%,transparent);animation:fadeUp .25s var(--ease) both}
/* media in bubbles */
.media{border-radius:16px;overflow:hidden;position:relative;margin:0 0 3px;width:min(212px,56vw);background:color-mix(in srgb,var(--a) 8%,var(--surface))}
.media img,.media video{display:block;width:100%;height:auto;max-height:210px;object-fit:cover}
.playbig{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,15,25,.28)}
.playbig span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center}
.dur{position:absolute;left:8px;bottom:8px;background:rgba(10,15,25,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:9px}
.upbar{height:4px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden;margin:4px 0 2px}
.upbar i{display:block;height:100%;background:#fff;width:0;transition:width .25s linear}
/* voice */
.voice{display:flex;align-items:center;gap:9px;width:min(206px,56vw);padding:1px 0}
.vbtn{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.22)}
.bwrap.you .vbtn{background:var(--surface);box-shadow:3px 3px 8px var(--sh-dark),-3px -3px 8px var(--sh-light)}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:26px;cursor:pointer}
.wave i{flex:1;border-radius:2px;background:currentColor;opacity:.35;transition:opacity .15s}
.wave i.on{opacity:1}
.vtime{font-size:10.5px;opacity:.85;min-width:62px;text-align:right;white-space:nowrap}
.reccard{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:22px;margin:0 12px 8px;background:var(--surface);box-shadow:inset 4px 4px 9px var(--sh-dark),inset -4px -4px 9px var(--sh-light)}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
/* composer */
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);
  background:var(--glass);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);border-top:1px solid var(--line)}
.comp-inset{flex:1;display:flex;align-items:flex-end;gap:8px;padding:5px 12px;border-radius:22px}
.comp-inset textarea{flex:1;border:0;background:transparent;outline:none;resize:none;max-height:112px;padding:11px 0;font-size:15px;line-height:1.35}
.sendbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--a2),var(--a));box-shadow:0 8px 18px color-mix(in srgb,var(--a) 42%,transparent);transition:transform .16s var(--ease)}
.sendbtn:active{transform:scale(.9)}
.replybar{display:flex;align-items:center;gap:10px;margin:0 12px 6px;padding:9px 12px;border-radius:16px;background:var(--surface);box-shadow:inset 3px 3px 8px var(--sh-dark),inset -3px -3px 8px var(--sh-light);animation:fadeUp .2s var(--ease) both}
/* sheets */

/* ============ 2026 CRISP XCHAT REDESIGN ============ */
html[data-mode="light"]{

.glass{backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
.btn{border-radius:13px;padding:14px 18px;background:var(--a);box-shadow:0 8px 18px color-mix(in srgb,var(--a) 22%,transparent);letter-spacing:0}

/* ============ LIQUID GLASS + SOFT NEUMORPHIC (perf-tuned) ============ */
html[data-mode="light"]{
  --glass:rgba(255,255,255,.62);--glass-2:rgba(255,255,255,.44);--glass-b:rgba(255,255,255,.75);
  --sheen:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.25) 42%,rgba(255,255,255,.55));
  --nm-d:rgba(41,86,147,.13);--nm-l:rgba(255,255,255,.95);
  --halo2:color-mix(in srgb,var(--a) 14%,#ffffff);
}
html[data-mode="dark"]{
  --glass:rgba(18,32,52,.58);--glass-2:rgba(16,28,46,.44);--glass-b:rgba(146,196,255,.16);
  --sheen:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 45%,rgba(255,255,255,.07));
  --nm-d:rgba(0,0,0,.45);--nm-l:rgba(255,255,255,.05);
}
body{background:
  radial-gradient(760px 520px at 8% -8%, color-mix(in srgb,var(--a) 16%, transparent) 0%, transparent 62%),
  radial-gradient(680px 560px at 108% 4%, color-mix(in srgb,var(--a2) 18%, transparent) 0%, transparent 60%),
  linear-gradient(160deg,var(--bg2),var(--bg))}
.app{background:transparent;box-shadow:none}
/* one shared glass recipe, GPU-cheap: single blur layer + hairline + soft neumorphic lift */
.glass,.nav,.chat-head,.composer,.sheet,.searchbar,.card,.row,.raised,.iconbtn,.chip,.att-ic,.swatch,.reccard,.daysep,.seg{
  background-color:var(--glass);
  background-image:var(--sheen);
  border:1px solid var(--glass-b);
  box-shadow:0 8px 22px var(--nm-d), 0 1px 0 var(--nm-l) inset, 0 -1px 0 color-mix(in srgb,var(--a) 8%,transparent) inset;
}
.nav,.chat-head,.composer,.sheet,.searchbar{
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
}
.row,.card,.raised,.iconbtn,.chip,.att-ic,.swatch,.seg{-webkit-backdrop-filter:blur(8px) saturate(150%);backdrop-filter:blur(8px) saturate(150%)}
.row{border-radius:18px;margin:6px 0;padding:11px 13px;transition:transform .14s var(--ease),box-shadow .18s var(--ease)}
.row:active,.row.pressing{transform:scale(.982);box-shadow:0 2px 8px var(--nm-d), 0 1px 0 var(--nm-l) inset}
.card,.raised{border-radius:20px}
.iconbtn{border-radius:50%}
.searchbar{border-radius:18px !important}
.nav{border-radius:22px}
.inset,.comp-inset{background:var(--glass-2);border:1px solid var(--glass-b);
  box-shadow:inset 0 2px 6px var(--nm-d), inset 0 -1px 0 var(--nm-l)}
.comp-inset{border-radius:18px}
.btn{border-radius:16px;background:linear-gradient(150deg,var(--a2),var(--a));
  box-shadow:0 10px 24px color-mix(in srgb,var(--a) 30%,transparent), inset 0 1px 0 rgba(255,255,255,.4)}
.btn.ghost{background:var(--glass);background-image:var(--sheen);color:var(--a);border:1px solid var(--glass-b);box-shadow:0 6px 16px var(--nm-d)}
.sendbtn{background:linear-gradient(150deg,var(--a2),var(--a));box-shadow:0 8px 18px color-mix(in srgb,var(--a) 34%,transparent), inset 0 1px 0 rgba(255,255,255,.4)}
.bub{border-radius:19px}
.bwrap.me .bub{background:linear-gradient(150deg,var(--a2),var(--a));border:1px solid color-mix(in srgb,#fff 26%,transparent);
  box-shadow:0 6px 16px color-mix(in srgb,var(--a) 26%,transparent), inset 0 1px 0 rgba(255,255,255,.28);border-bottom-right-radius:7px}
.bwrap.you .bub{background-color:var(--glass);background-image:var(--sheen);border:1px solid var(--glass-b);
  box-shadow:0 5px 14px var(--nm-d), inset 0 1px 0 var(--nm-l);border-bottom-left-radius:7px}
/* Only the bubble itself should show: a solid themed edge, full corners and no dark outer lift. */
.bwrap.you .bub{background:var(--bubble-you);background-image:none;border:1.5px solid var(--a);border-radius:20px;box-shadow:none;filter:none}
.bwrap.you.pressing .bub{box-shadow:none}
.bwrap.me .bub{border-radius:20px;box-shadow:none}
.bwrap{contain:layout}
.avatar{border:1.5px solid var(--glass-b);outline:none;box-shadow:0 4px 12px var(--nm-d), inset 0 1px 0 var(--nm-l)}
.sheet{border-radius:26px 26px 0 0;box-shadow:0 -12px 40px var(--nm-d), inset 0 1px 0 var(--nm-l)}
.sheet-back{background:rgba(10,18,32,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.toast{background:var(--glass);background-image:var(--sheen);color:var(--text);border:1px solid var(--glass-b);
  -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:0 10px 26px var(--nm-d)}
.switch{background:var(--glass-2);border:1px solid var(--glass-b);box-shadow:inset 0 2px 6px var(--nm-d)}
.nav button.active{color:var(--a)}
.press:active,.iconbtn:active,.att-tile:active .att-ic{transform:scale(.94)}
/* keep scrolling surfaces cheap: no blur on long lists or message canvas */
.list,.msgs,.scroll{backdrop-filter:none;-webkit-backdrop-filter:none}
/* Hardware acceleration must never cancel the dock's horizontal centering. */
.chat-head,.composer,.sheet,.row{will-change:auto;transform:translateZ(0)}
.nav{will-change:auto;transform:translateX(-50%) translateZ(0) !important}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass,.nav,.chat-head,.composer,.sheet,.searchbar,.card,.row,.raised,.iconbtn{background-color:var(--surface)}
}

/* ============ PREMIUM FLOATING CHROME (liquid glass + soft neumorphism) ============
   Every floating surface uses one blur layer, one hairline and one soft lift so the
   phone composites a single cheap pass per surface. Nothing here adds a repaint to
   the scrolling message canvas. */
html[data-mode="light"]{
  --float-shadow:0 10px 30px rgba(28,63,110,.13), 0 2px 8px rgba(28,63,110,.06);
  --float-inner:inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(42,124,246,.07);
}
html[data-mode="dark"]{
  --float-shadow:0 12px 34px rgba(0,0,0,.52), 0 2px 8px rgba(0,0,0,.34);
  --float-inner:inset 0 1px 0 rgba(255,255,255,.07), inset 0 -1px 0 rgba(0,0,0,.28);
}
/* instant touch: no 300ms wait, no scroll-chaining, no text-selection lag */
button,.row,.bwrap,.att-tile,.iconbtn,.nav button,.srow,.chip,.swatch,.seg button{touch-action:manipulation}
.press,.row,.iconbtn,.nav button,.sendbtn,.btn{transition-duration:.12s}

/* floating dock */
.nav{
  width:min(calc(100% - 22px),428px);height:62px;border-radius:24px;
  bottom:calc(env(safe-area-inset-bottom) + 12px);
  box-shadow:var(--float-shadow), var(--float-inner);
  padding:0 4px;gap:2px;
}
.nav button{flex:1 1 0;min-width:0;padding:7px 2px;gap:3px;font-size:10px;border-radius:16px;position:relative;overflow:hidden}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button svg{width:22px;height:22px}
.nav button::before{content:"";position:absolute;inset:4px;border-radius:14px;opacity:0;
  background:color-mix(in srgb,var(--a) 13%,transparent);transition:opacity .14s var(--ease)}
.nav button.active::before{opacity:1}
.nav button.active{color:var(--a);transform:none}
.nav button:active{transform:scale(.93)}
.navdot{bottom:2px;height:2.5px;width:14px}

/* floating top bar */
.topbar{
  margin:calc(env(safe-area-inset-top) + 10px) 12px 8px;padding:9px 12px;border-radius:22px;
  background-color:var(--glass);background-image:var(--sheen);border:1px solid var(--glass-b);
  box-shadow:var(--float-shadow), var(--float-inner);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
}
.topbar h2{font-size:21px}

/* floating search */
.searchbar{margin:0 12px 8px;border-radius:20px !important;box-shadow:var(--float-shadow), var(--float-inner)}

/* floating chat header */
.chat-head{
  margin:calc(env(safe-area-inset-top) + 10px) 12px 4px;padding:8px 10px;border-radius:22px;border-bottom:0;
  box-shadow:var(--float-shadow), var(--float-inner);
}

/* floating composer */
.composer{
  margin:0 12px calc(env(safe-area-inset-bottom) + 10px);padding:7px 8px;border-radius:24px;border-top:0;
  box-shadow:var(--float-shadow), var(--float-inner);gap:6px;
}
.comp-inset{border-radius:20px;padding:2px 12px;box-shadow:inset 0 1px 4px var(--nm-d)}
.sendbtn{width:42px;height:42px}
.msgs{padding-bottom:4px}

/* compact premium voice bubble — fits 360px through 430px */
.voice{width:min(214px,52vw);gap:8px;padding:2px 0}
.vbtn{width:32px;height:32px;box-shadow:var(--float-inner)}
.wave{height:22px;gap:1.5px}
.wave i{min-width:1.5px;border-radius:1.5px;opacity:.3;transition:opacity .1s linear}
.bwrap.me .wave i{background:#fff}

.vtime{font-size:10px;min-width:auto;opacity:.75;font-variant-numeric:tabular-nums}

/* floating modals */
.sheet{margin:0 auto;max-width:480px;border-radius:28px 28px 0 0;box-shadow:0 -14px 44px var(--nm-d), var(--float-inner)}
.toast{box-shadow:var(--float-shadow), var(--float-inner);bottom:calc(var(--nav-h) + 34px)}

/* the dock and composer never overlap content */
.list{padding-bottom:calc(var(--nav-h) + 40px)}

/* ---- Discover / friend requests ---- */
.dhead h2{font-size:26px;line-height:1.1}
.dsub{font-size:13px;color:var(--muted);margin-top:2px}
.seg{display:flex;gap:6px;margin:4px 14px 10px;padding:5px;border-radius:20px}

.segbadge{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center}

.fdot.on{background:var(--ok);opacity:1}
.ftime{font-size:11.5px;color:var(--muted);margin-top:2px}
.fside{display:flex;align-items:center;flex:none}

.fbtn:active{transform:scale(.96)}

/* =========================================================
   XChat Messenger — frontend-only prototype (HTML/CSS/JS only)
   Powered by Horizon Technologies
   Architecture note: every simulated capability (auth, realtime,
   presence, media upload, contact sync) is isolated behind the
   Net.* facade so a real backend can replace it 1:1 later.
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RE_URL=/((?:https?:\/\/|www\.)[^\s<]+[^\s<.,:;!?)])/gi;
const RE_MAIL=/([A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,})/gi;
const RE_TEL=/(\+?\d[\d\s().-]{6,}\d)/g;
function linkify(str){
  let h=esc(str);
  h=h.replace(RE_MAIL,m=>`<span class="ent" data-ent="mail" data-val="${m}">${m}</span>`);
  h=h.replace(RE_URL,m=>/data-val=|class="ent"/.test(m)?m:`<span class="ent" data-ent="url" data-val="${m}">${m}</span>`);
  h=h.split(/(<span class="ent"[\s\S]*?<\/span>)/).map(part=>
    part.startsWith('<span class="ent"')?part:part.replace(RE_TEL,m=>`<span class="ent" data-ent="tel" data-val="${m.trim()}">${m}</span>`)
  ).join('');
  return h;
}
function entSheet(kind,val){
  const label=kind==='mail'?'Email address':kind==='tel'?'Phone number':'Link';
  const s=sheet(`<div class="grab"></div><h3 style="font-size:16px">${label}</h3>
   <p class="hint" style="margin:8px 0 14px;word-break:break-all">${esc(val)}</p>
   <div class="actionlist">
     <button data-e="copy">${I.copy} Copy</button>
     <button data-e="open">${I.chev} Open</button>
   </div>`);
  s.q('[data-e="copy"]').onclick=async()=>{try{await navigator.clipboard.writeText(val)}catch(e){}s.close();toast('Copied')};
  s.q('[data-e="open"]').onclick=()=>{
    s.close();
    let href=val;
    if(kind==='mail')href='mailto:'+val;
    else if(kind==='tel')href='tel:'+val.replace(/[^\d+]/g,'');
    else if(!/^https?:\/\//i.test(val))href='https://'+val;
    window.open(href,'_blank','noopener');
  };
}
/* Telegram-style entities: tapping an underlined link, email or number copies it. */
async function copyText(v){
  try{await navigator.clipboard.writeText(v);return true}
  catch(e){
    try{const ta=document.createElement('textarea');ta.value=v;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}
    catch(_){return false}
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('.ent');if(!el)return;
  e.preventDefault();e.stopPropagation();
  copyText(el.dataset.val).then(ok=>{buzz(12);toast(ok?'Copied':'Could not copy')});
},true);
document.addEventListener('contextmenu',e=>{const el=e.target.closest('.ent');if(el){e.preventDefault();entSheet(el.dataset.ent,el.dataset.val)}});

/* Only blob/data URLs created by this device, or URLs on our own storage host,
   may ever reach an <img>/<video>. Anything else (a link a user typed into
   their profile row by hand) is dropped so it can never run code. */
function trustedMediaUrl(u){
 const s=String(u||'');
 if(!s)return '';
 if(/^blob:/i.test(s))return s;
 if(/^data:(image|video|audio)\//i.test(s))return s;
 try{
  const url=new URL(s,location.href);
  if(url.protocol!=='https:'&&url.protocol!=='http:')return '';
  const own=SUPA_URL?new URL(SUPA_URL).host:'';
  if(own&&url.host===own)return url.href;
  if(url.host===location.host)return url.href;
  return '';
 }catch(e){return ''}
}
/* Safe for direct interpolation into a src="" attribute. */
const srcAttr=u=>esc(trustedMediaUrl(u));
async function signed(bucket,path,ttl=3600){
 if(!path)return '';
 if(/^(blob:|data:|https?:)/i.test(path))return trustedMediaUrl(path);
 const key=bucket+'/'+path, hit=SIGCACHE.get(key);
 if(hit&&hit.exp>Date.now())return hit.url;
 try{
  const {data}=await SB.storage.from(bucket).createSignedUrl(path,ttl);
  const url=data?data.signedUrl:'';
  if(url)SIGCACHE.set(key,{url,exp:Date.now()+Math.max(30,ttl-120)*1000});
  return url;
 }catch(e){return hit?hit.url:''}
}


/* ---------------- offline media cache (photos, videos, voice) ----------------
   Every photo/video/voice a chat shows is stored once in IndexedDB, so leaving
   and re-entering a chat renders instantly and still works with no network. */
const MEDIA={
 db:null,ready:null,urls:new Map(),misses:new Set(),
 open(){
  if(this.ready)return this.ready;
  this.ready=new Promise(res=>{
   try{
    const rq=indexedDB.open('xchat-media',1);
    rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains('media'))db.createObjectStore('media')};
    rq.onsuccess=()=>{this.db=rq.result;res(this.db)};
    rq.onerror=()=>res(null);
   }catch(e){res(null)}
  });
  return this.ready;
 },
 async raw(key){
  const db=await this.open();if(!db)return null;
  return new Promise(res=>{try{const tx=db.transaction('media','readonly');
   const rq=tx.objectStore('media').get(String(key));rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null)}catch(e){res(null)}});
 },
 async url(bucket,path){
  if(!path)return '';
  const key=bucket+'/'+path;
  if(this.urls.has(key))return this.urls.get(key);
  if(this.misses.has(key))return '';
  const rec=await this.raw(key);
  if(!rec||!rec.blob){this.misses.add(key);return ''}
  const u=URL.createObjectURL(rec.blob);
  this.urls.set(key,u);return u;
 },
 async save(bucket,path,blob){
  if(!path||!blob)return;
  const db=await this.open();if(!db)return;
  const key=bucket+'/'+path;
  try{
   await new Promise((res,rej)=>{const tx=db.transaction('media','readwrite');
    tx.objectStore('media').put({blob,mime:blob.type||'',at:Date.now()},key);
    tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
   this.misses.delete(key);
   if(!this.urls.has(key))this.urls.set(key,URL.createObjectURL(blob));
  }catch(e){}
 },
 async cache(bucket,path,url){
  if(!path||!url||this.urls.has(bucket+'/'+path))return;
  if(!/^https?:/.test(url))return;
  try{const r=await fetch(url);if(!r.ok)return;await this.save(bucket,path,await r.blob())}catch(e){}
 }
};

/* =========================================================
   END-TO-END ENCRYPTION (baseline)
   Each device keeps an ECDH P-256 private key in local storage and
   publishes only its public key. Message text for a direct chat is
   sealed with an AES-GCM key derived from both public keys, so the
   server only ever stores ciphertext. If a peer has no key yet we
   fall back to plain text so messaging never breaks.
   ========================================================= */
const E2E={priv:null,pub:null,keys:new Map()};
const b64e=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const isSealed=v=>typeof v==='string'&&v.startsWith('e2e1.');
async function e2eInit(){
 if(!ME||!window.crypto||!crypto.subtle||!crypto.subtle.deriveKey)return;
 try{
  const store='xchat.e2e.'+ME.id;
  let saved=null;try{saved=JSON.parse(localStorage.getItem(store)||'null')}catch(e){}
  if(saved&&saved.priv&&saved.pub){
   E2E.priv=await crypto.subtle.importKey('jwk',saved.priv,{name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
   E2E.pub=saved.pub;
  }else{
   const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
   const priv=await crypto.subtle.exportKey('jwk',kp.privateKey);
   const pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
   try{localStorage.setItem(store,JSON.stringify({priv,pub}))}catch(e){}
   E2E.priv=kp.privateKey;E2E.pub=pub;
  }
  const mine=JSON.stringify(E2E.pub);
  if(localStorage.getItem('xchat.e2e.pub.'+ME.id)!==mine){
   const {error}=await SB.from('profiles').update({e2e_pub:mine}).eq('id',ME.id);
   if(!error)try{localStorage.setItem('xchat.e2e.pub.'+ME.id,mine)}catch(e){}
  }
 }catch(e){console.warn('e2e init',e);E2E.priv=null}
}
function peerKey(id){

async function seal(text,peer){
 if(!text)return text;
 const k=await peerKey(peer);if(!k)return text;
 try{
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(text));
  return 'e2e1.'+b64e(iv)+'.'+b64e(ct);
 }catch(e){return text}
}
const SEAL_FALLBACK='🔒 Message sent from an older version';
async function unseal(text,peer){
 if(!isSealed(text))return text;
 const k=await peerKey(peer);if(!k)return SEAL_FALLBACK;
 try{
  const parts=text.split('.');
  const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(parts[1])},k,b64d(parts[2]));
  return new TextDecoder().decode(out);
 }catch(e){return SEAL_FALLBACK}
}
async function unsealList(list,peer){

/* Photos are resized on the phone before upload: big camera shots (5–12 MB)
   otherwise stall on mobile data and slow the chat down for the receiver. */
async function compressImage(file){
 try{
  if(!file||!/^image\//.test(file.type||'')||/gif|svg/.test(file.type))return file;
  if(file.size<320*1024)return file;
  if(typeof createImageBitmap!=='function')return file;
  const bmp=await createImageBitmap(file);
  const max=1600,scale=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  cv.getContext('2d').drawImage(bmp,0,0,w,h);
  bmp.close&&bmp.close();
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
  if(!blob||blob.size>=file.size)return file;
  return new File([blob],(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
 }catch(e){return file}
}

 if(payload.eventType==='INSERT'){
  if(existing)return;

    const pending=chat.msgs.find(x=>String(x.id).startsWith('tmp')&&x.st==='sending'&&mapped.clientId&&x.clientId===mapped.clientId);
   if(pending){pending.id=m.id;pending.st=mapped.st;pending.t=mapped.t;refreshUI();return}
  }
  if(mapped.reply){const src=chat.msgs.find(x=>x.id===mapped.reply.id);if(src){mapped.reply.from=src.from;mapped.reply.text=previewOf(src)}}
  if(isSealed(mapped.text))mapped.text=await unseal(mapped.text,chat.id);

/* Typing, reactions and call signalling used to travel on two global channels
   that every signed-in user joined. They are now scoped per conversation: the
   topic embeds the conversation id, which only its participants can obtain. */
function convChannel(conv){
 if(!conv||!ME)return null;
 const existing=CONVCH.get(conv);if(existing)return existing;
 const ch=SB.channel('xchat-conv-'+conv,{config:{broadcast:{self:false}}})
  .on('broadcast',{event:'typing'},({payload})=>{
   if(!payload||payload.user===ME.id||payload.conv!==conv)return;
   if(payload.on)TYPING.set(conv,{user:payload.user,exp:Date.now()+5000});
   else TYPING.delete(conv);
   if(LIVE.typing)LIVE.typing(conv,!!payload.on);
   if(LIVE.list)LIVE.list();
   if(payload.on)setTimeout(()=>{if(!typingActive(conv)){TYPING.delete(conv);if(LIVE.typing)LIVE.typing(conv,false);if(LIVE.list)LIVE.list()}},5200);
  })
  .on('broadcast',{event:'react'},({payload})=>{
   if(!payload||payload.user===ME.id||payload.conv!==conv)return;
   const chat=chatByConv(conv);if(!chat)return;
   const msg=chat.msgs.find(m=>m.id===payload.id);if(!msg)return;
   msg.reacts=msg.reacts||{};
   if(payload.removed)delete msg.reacts[payload.user];else msg.reacts[payload.user]=payload.emoji;
   refreshUI();
  })
  .on('broadcast',{event:'signal'},({payload})=>{
   if(payload&&payload.to===ME.id&&payload.from!==ME.id)handleCallSignal(payload);
  }).subscribe();
 CONVCH.set(conv,ch);return ch;
}
function syncConvChannels(){if(!ME)return;(S.chats||[]).forEach(c=>{if(c.conv)convChannel(c.conv)})}

 online:navigator.onLine, el:null,

 },

 subs:new Set(),
 /* Anything that must pause/resume with connectivity subscribes here, so the
    whole app shares one source of truth instead of per-screen checks. */
 on(fn){this.subs.add(fn);return()=>this.subs.delete(fn)},
 set(online){
   online=!!online;

/* ---------------- transfers (real progress, pause & resume) ---------------- */
const Transfer={
 async token(){try{const {data}=await SB.auth.getSession();return data&&data.session?data.session.access_token:''}catch(e){return ''}},
 async upload(bucket,path,file,onProg,handle){
  const token=await this.token();
  return new Promise((res,rej)=>{
   const xhr=new XMLHttpRequest();
   if(handle)handle.xhr=xhr;
   xhr.open('POST',SUPA_URL+'/storage/v1/object/'+bucket+'/'+path.split('/').map(encodeURIComponent).join('/'));
   xhr.setRequestHeader('authorization','Bearer '+token);
   xhr.setRequestHeader('apikey',SUPA_KEY);
   xhr.setRequestHeader('x-upsert','true');
   if(file.type)xhr.setRequestHeader('content-type',file.type);
   xhr.upload.onprogress=e=>{if(e.lengthComputable&&onProg)onProg(Math.max(1,Math.round(e.loaded/e.total*100)))};
   xhr.onload=()=>(xhr.status>=200&&xhr.status<300)?res(path):rej(new Error('upload-'+xhr.status));
   xhr.onerror=()=>rej(new Error('network'));
   xhr.ontimeout=()=>rej(new Error('timeout'));
   xhr.onabort=()=>rej(new Error('aborted'));
   xhr.send(file);
  });
 },
 download(url,onProg,handle){
  return new Promise((res,rej)=>{
   const xhr=new XMLHttpRequest();
   if(handle)handle.xhr=xhr;
   xhr.open('GET',url);xhr.responseType='blob';
   xhr.onprogress=e=>{if(e.lengthComputable&&onProg)onProg(Math.max(1,Math.round(e.loaded/e.total*100)))};
   xhr.onload=()=>(xhr.status>=200&&xhr.status<300)?res(xhr.response):rej(new Error('download-'+xhr.status));
   xhr.onerror=()=>rej(new Error('network'));
   xhr.onabort=()=>rej(new Error('aborted'));
   xhr.send();
  });
 }
};

const FILES={
 db:null,ready:null,index:new Set(),
 key(){return 'xchat.files.'+((ME&&ME.id)||'anon')},
 loadIndex(){try{this.index=new Set(JSON.parse(localStorage.getItem(this.key())||'[]'))}catch(e){this.index=new Set()}},
 saveIndex(){try{localStorage.setItem(this.key(),JSON.stringify([...this.index]))}catch(e){}},
 open(){
  if(this.ready)return this.ready;
  this.ready=new Promise(res=>{
   try{
    const rq=indexedDB.open('xchat-files',1);
    rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files')};
    rq.onsuccess=()=>{this.db=rq.result;res(this.db)};
    rq.onerror=()=>res(null);
   }catch(e){res(null)}
  });
  return this.ready;
 },
 has(id){return this.index.has(String(id))},
 async put(id,rec){
  const db=await this.open();if(!db)return false;
  await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');
   tx.objectStore('files').put(rec,String(id));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
  this.index.add(String(id));this.saveIndex();return true;
 },
 async get(id){
  const db=await this.open();if(!db)return null;
  return new Promise(res=>{const tx=db.transaction('files','readonly');
   const rq=tx.objectStore('files').get(String(id));rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null)});
 }
};

const DISPOSABLE_EMAIL=new Set(['mailinator.com','yopmail.com','guerrillamail.com','guerrillamail.net','sharklasers.com','grr.la','10minutemail.com','10minutemail.net','tempmail.com','temp-mail.org','tempmailo.com','tempmail.dev','throwawaymail.com','trashmail.com','trashmail.de','getnada.com','nada.email','dispostable.com','fakeinbox.com','maildrop.cc','mailnesia.com','moakt.com','mohmal.com','emailondeck.com','spamgourmet.com','mytemp.email','burnermail.io','tempr.email','discard.email','inboxkitten.com','harakirimail.com','luxusmail.org','minuteinbox.com','mailcatch.com','tmpmail.org','einrot.com','vomoto.com','spam4.me','byom.de','anonbox.net','tmail.ws','emltmp.com','mail-temp.com','1secmail.com','1secmail.net','1secmail.org']);
function isDisposableEmail(email){
 const at=String(email||'').lastIndexOf('@');
 if(at<0)return false;
 const host=email.slice(at+1).toLowerCase();
 if(DISPOSABLE_EMAIL.has(host))return true;
 // also block subdomains such as inbox.mailinator.com
 return [...DISPOSABLE_EMAIL].some(d=>host.endsWith('.'+d));
}

 const v=mount(`<div class="topbar"><button class="iconbtn press" id="bk">${I.back}</button><h2>${t('auth.register')}</h2></div>
  <div class="scroll pad" style="flex:1;padding-top:6px">
   <h1 style="font-size:25px;font-weight:800">${t('auth.newAcc')}</h1>
   <p class="muted small" style="margin:6px 0 12px">${t('auth.newSub')}</p>
   <label class="field"><label>${t('auth.email')}</label><div class="inset"><input id="em" type="email" placeholder="you@example.com"></div></label>
   <div class="field"><label>${t('auth.phone')}</label>
     <div style="display:flex;gap:9px">
       <button class="inset press" id="cty" style="padding:0 12px;min-width:118px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600">
         <span id="ctyf" style="font-size:19px">${country.f}</span><span id="ctyc">${country.c}</span></button>
       <div class="inset" style="flex:1;display:flex;align-items:center;padding:0 14px"><input id="ph" type="tel" inputmode="numeric" placeholder="8031234567" style="flex:1;border:0;background:transparent;outline:none"></div>
     </div><div class="small muted" style="margin:7px 0 0 6px" id="ctyn">${country.n}</div></div>
   <label class="field"><label>${t('auth.pass')}</label><div class="inset"><input id="pw" type="password" placeholder="At least 6 characters"></div></label>
   <label class="field"><label>${t('auth.pass2')}</label><div class="inset"><input id="pw2" type="password" placeholder="Repeat password"></div></label>
   <div id="err" class="err"></div>
   <button class="btn" id="go">${t('auth.register')}</button>
   <div class="small muted" style="text-align:center;margin-top:14px">Already registered?
     <button style="color:var(--a);font-weight:700" id="lg">${t('auth.login')}</button></div>
  </div><div class="brand-foot">••Powered by Horizon Technologies ••</div>`,'slide');
 $('#bk',v).onclick=()=>{app.innerHTML='';screenWelcome()};
 $('#lg',v).onclick=()=>{app.innerHTML='';screenLogin()};
 $('#cty',v).onclick=()=>countrySheet(c=>{country=c;$('#ctyf',v).textContent=c.f;$('#ctyc',v).textContent=c.c;$('#ctyn',v).textContent=c.n});
 $('#go',v).onclick=async()=>{
  const em=$('#em',v).value.trim().toLowerCase(),ph=$('#ph',v).value.replace(/\D/g,''),
        pw=$('#pw',v).value,pw2=$('#pw2',v).value,err=$('#err',v);
  err.style.color='';
  if(!/^\S+@\S+\.\S+$/.test(em))return err.textContent='Enter a valid email address.';
  if(isDisposableEmail(em))return err.textContent='Temporary email addresses can\'t be used. Please sign up with a personal or work email.';
  if(ph.length<6)return err.textContent='Enter a valid phone number.';
  if(pw.length<6)return err.textContent='Password must be at least 6 characters.';
  if(pw!==pw2)return err.textContent='Passwords do not match.';
  if(!Net.online)return err.textContent='You\'re offline. Connect and try again.';
  const b=$('#go',v);b.disabled=true;b.textContent='Creating account…';
  const phone=country.c+ph.replace(/^0+/,'');
  const {data:signup,error}=await SB.auth.signUp({email:em,password:pw,options:{data:{phone},emailRedirectTo:location.origin}});
  if(error){b.disabled=false;b.textContent=t('auth.register');return err.textContent=error.message}
  // Accounts are confirmed automatically, so new users go straight in. If the
  // project still has manual confirmation switched on there is no session yet —
  // we sign in directly rather than sending anyone to their inbox.
  if(!signup||!signup.session){
   const {error:e2}=await SB.auth.signInWithPassword({email:em,password:pw});
   if(e2){
    b.disabled=false;b.textContent=t('auth.register');
    err.style.color='var(--ok)';
    err.textContent='Your account was created. Confirm it from the email we sent, then log in.';
    return;
   }
  }
  const {data:{session}}=await SB.auth.getSession();
  const user=session&&session.user;
  if(user)await SB.from('profiles').update({phone,email:em}).eq('id',user.id);
  await bootSession();render();
 };
}

function cropSheet(src,cb){
 let zoom=1.1,x=0,y=0;
 const s=sheet(`<div class="grab"></div><h3>Adjust your photo</h3>
  <p class="hint" style="margin:6px 0 0">Drag to reposition • slide to zoom</p>
  <div class="cropbox" id="cb"><img id="ci" src="${src}"></div>
  <input type="range" id="zm" min="100" max="260" value="110">
  <div style="display:flex;gap:10px;margin-top:14px">
    <button class="btn ghost" id="cx">Cancel</button><button class="btn" id="ok">Use photo</button></div>`);
 const img=s.q('#ci'),box=s.q('#cb');
 const put=()=>img.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) scale(${zoom})`;
 img.onload=()=>{const r=img.naturalWidth/img.naturalHeight;
   if(r>1){img.style.height='220px';img.style.width='auto'}else{img.style.width='220px';img.style.height='auto'}put()};
 s.q('#zm').oninput=e=>{zoom=e.target.value/100;put()};
 let dr=false,px=0,py=0;
 const st=e=>{dr=true;const p=e.touches?e.touches[0]:e;px=p.clientX;py=p.clientY};
 const mv=e=>{if(!dr)return;const p=e.touches?e.touches[0]:e;x+=p.clientX-px;y+=p.clientY-py;px=p.clientX;py=p.clientY;put();e.preventDefault()};
 const en=()=>dr=false;
 box.addEventListener('mousedown',st);box.addEventListener('touchstart',st,{passive:true});
 window.addEventListener('mousemove',mv);box.addEventListener('touchmove',mv,{passive:false});
 window.addEventListener('mouseup',en);box.addEventListener('touchend',en);
 s.q('#cx').onclick=s.close;
 s.q('#ok').onclick=()=>{
  const c=document.createElement('canvas');c.width=c.height=320;const g=c.getContext('2d');
  const scale=320/220,dw=img.width*zoom*scale,dh=img.height*zoom*scale;
  g.drawImage(img,160+x*scale-dw/2,160+y*scale-dh/2,dw,dh);
  cb(c.toDataURL('image/jpeg',.86));s.close();
 };
}

function chatPreview(c){
 const last=c.msgs.filter(m=>!m.hiddenForMe).slice(-1)[0];
 if(!last)return{txt:'',t:0,st:''};

   last.type==='image'?'📷 Photo':last.type==='video'?'🎬 Video':last.type==='voice'?'🎤 Voice message '+mmss(last.dur):
   (last.type==='file'||last.type==='doc')?'📄 '+fileMeta(last).name:last.text;

async function openChat(id){
 let chat=S.chats.find(c=>c.id===id);
 if(!chat){
  if(!isFriend(id)){toast('You can message '+person(id).name+' after they accept your friend request.');S.tab='contacts';render();return}
  const {data,error}=await SB.rpc('get_or_create_direct_conversation',{_other:id});
  if(error)return toast(error.message);
  await fetchProfiles([id]);
  chat={id,conv:data,msgs:[],unread:0};S.chats.unshift(chat);convChannel(chat.conv);
 }
 // the native layer suppresses a push for the conversation already on screen
 S.openChat=id;window.XChatActiveChat=chat.conv||id;render();
}

function phoneKey(v){const d=String(v||'').replace(/\D/g,'');return d.slice(-9)}
function samePhone(a,b){const x=phoneKey(a),y=phoneKey(b);return !!x&&x===y}
function matchedContacts(){
 if(!S.contactsAllowed)return[];
 return (S.savedContacts||[]).map(c=>{
   const u=(S.contactMatches||[]).find(p=>samePhone(p.phone,c.phone));
   return u?{...u,saved:c.name,onx:true}:{...c,onx:false};
 });
}
function manualContactsSheet(after){
 const s=sheet(`<div class="grab"></div><h3 style="font-size:17px">Add your contacts</h3>
  <p class="hint" style="margin:8px 0 12px">Your device's contact book isn't available in this browser. Paste or type contacts below — one per line, as <b>Name, +2348012345678</b>.</p>
  <textarea id="mc" rows="7" placeholder="Ada, +2348012345678&#10;John, +2349098765432" style="width:100%;border:0;outline:none;padding:14px;border-radius:16px;resize:vertical;font:inherit" class="inset"></textarea>
  <button class="btn" id="mcsave" style="margin-top:14px">Save & match on XChat</button>`);
 s.q('#mcsave').onclick=async()=>{
  const lines=(s.q('#mc').value||'').split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const seen=new Set(),rows=[];
  for(const l of lines){
   const m=l.split(/[,;\t]/);
   const phoneRaw=(m.length>1?m.slice(1).join(''):m[0]);
   const phone=normPhone(phoneRaw);
   const name=(m.length>1?m[0].trim():phone)||phone;
   if(phone.replace(/\D/g,'').length<8||seen.has(phone))continue;
   seen.add(phone);rows.push({owner_id:ME.id,name,phone});
  }
  if(!rows.length)return toast('Add at least one valid phone number.');
  const {error}=await SB.from('contacts').upsert(rows,{onConflict:'owner_id,phone'});
  if(error)return toast(error.message);
  S.contactsAllowed=true;save&&save();
  await refreshContacts();
  s.close();render();
  const onx=matchedContacts().filter(c=>c.onx).length;
  toast(onx+' of '+rows.length+' contacts are on XChat');
  if(after)after();
 };
}
/* ---------------- FRIENDS (the only path to messaging) ---------------- */
// One cached list of open relationships (pending + accepted), keyed by request id.
const FR={map:new Map(DB.get('fr.list',[]).map(r=>[r.id,r])),busy:new Set(),
 save(){DB.set('fr.list',[...this.map.values()])},
 put(r){ if(!r||!r.id)return; if(r.status==='pending'||r.status==='accepted')this.map.set(r.id,r); else this.map.delete(r.id); this.save() },
 rel(uid){ for(const r of this.map.values()){ if(r.sender_id!==uid&&r.receiver_id!==uid)continue;
   if(r.status==='accepted')return{s:'friends',r}; return{s:r.sender_id===ME.id?'sent':'incoming',r} } return{s:'none'} },
 friends(){return [...this.map.values()].filter(r=>r.status==='accepted').map(r=>r.sender_id===ME.id?r.receiver_id:r.sender_id)},
 incoming(){return [...this.map.values()].filter(r=>r.status==='pending'&&r.receiver_id===ME.id).sort((a,b)=>b.created_at.localeCompare(a.created_at))},
 sent(){return [...this.map.values()].filter(r=>r.status==='pending'&&r.sender_id===ME.id)}};
function isFriend(uid){return !!ME&&FR.rel(uid).s==='friends'}
async function loadFriends(){
 if(!ME||!navigator.onLine)return;
 const {data,error}=await SB.from('friend_requests').select('id,sender_id,receiver_id,status,created_at,updated_at')
  .or(`sender_id.eq.${ME.id},receiver_id.eq.${ME.id}`).in('status',['pending','accepted']);
 if(error){console.warn('friends sync deferred',error.message);return}
 FR.map=new Map((data||[]).map(r=>[r.id,r]));FR.save();
 await fetchProfiles((data||[]).map(r=>r.sender_id===ME.id?r.receiver_id:r.sender_id)).catch(()=>{});

function friendBadge(){
 const n=ME?FR.incoming().length:0;
 $$('.nav button[data-tab="contacts"]').forEach(b=>{let el=b.querySelector('.navbadge');
  if(!n){el&&el.remove();return} if(!el){el=document.createElement('b');el.className='navbadge';b.appendChild(el)} el.textContent=n>9?'9+':n});

async function onFriendChange(payload){
 const r=payload.new&&payload.new.id?payload.new:payload.old; if(!r||!ME)return;
 if(r.sender_id!==ME.id&&r.receiver_id!==ME.id)return;
 const before=FR.map.get(r.id);
 if(payload.eventType==='DELETE')FR.map.delete(r.id),FR.save(); else FR.put(r);
 const other=r.sender_id===ME.id?r.receiver_id:r.sender_id;
 if(!DIR.get(other))await fetchProfiles([other]).catch(()=>{});
 // in-app hint only; the system notification comes from the single backend push pipeline
 if(!before&&r.status==='pending'&&r.receiver_id===ME.id)toast(person(other).name+' sent you a friend request');
 if(before&&before.status==='pending'&&r.status==='accepted'&&r.sender_id===ME.id)toast(person(other).name+' accepted your friend request');
 friendBadge();LIVE.disc&&LIVE.disc();refreshUI();
}
async function friendAction(kind,uid,reqId){
 const key=kind+':'+(reqId||uid); if(FR.busy.has(key))return; FR.busy.add(key);
 const prev=reqId?FR.map.get(reqId):null, now=new Date().toISOString();
 // optimistic: the button changes on tap, the server confirms right after
 if(kind==='add')FR.put({id:'tmp-'+uid,sender_id:ME.id,receiver_id:uid,status:'pending',created_at:now,updated_at:now});
 if(kind==='accept'&&prev)FR.put({...prev,status:'accepted'});
 if((kind==='decline'||kind==='cancel')&&prev)FR.map.delete(reqId),FR.save();
 friendBadge();LIVE.disc&&LIVE.disc();
 try{
  let res;
  if(kind==='add')res=await SB.rpc('send_friend_request',{_to:uid});
  else if(kind==='cancel')res=await SB.rpc('cancel_friend_request',{_id:reqId});
  else res=await SB.rpc('respond_friend_request',{_id:reqId,_accept:kind==='accept'});
  if(res.error)throw res.error;
  if(kind==='add'){FR.map.delete('tmp-'+uid);FR.save()}
  if(kind==='add'||kind==='accept')pushApi({action:'friend',to:uid});
  await loadFriends();
  if(kind==='accept')toast('You are now friends');
 }catch(e){
  if(kind==='add'){FR.map.delete('tmp-'+uid);FR.save()} else if(prev)FR.put(prev);
  toast(navigator.onLine?'Could not update the request. Try again.':'You\'re offline — try again when connected.');
  friendBadge();LIVE.disc&&LIVE.disc();
 }finally{FR.busy.delete(key)}
}

}

function convForPeer(id){const c=(S.chats||[]).find(x=>x.id===id);return c&&c.conv}
function callSignal(to,kind,data={}){

function toneCtx(){try{ACTX=ACTX||new (window.AudioContext||window.webkitAudioContext)();if(ACTX.state==='suspended')ACTX.resume();return ACTX}catch(e){return null}}
function beep(freq,dur,vol){const c=toneCtx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=0;o.connect(g);g.connect(c.destination);const n=c.currentTime;g.gain.linearRampToValueAtTime(vol,n+.05);g.gain.setValueAtTime(vol,n+Math.max(.06,dur-.06));g.gain.linearRampToValueAtTime(0,n+dur);o.start(n);o.stop(n+dur+.03)}
function startRing(incoming){

}
function stopRing(){if(RING){clearInterval(RING);RING=null}if(navigator.vibrate)try{navigator.vibrate(0)}catch(e){}}

function startCallTimer(){
 if(!CALL||CALL._timer)return;
 stopRing();clearTimeout(CALLTO);

/* ---------------- microphone access (one path for calls and voice notes) ----------------
   Inside the Android WebView getUserMedia does not raise the OS prompt on its own,
   so the native shell asks Android for RECORD_AUDIO first and only then do we open
   the stream. On the web the browser prompt does the same job. */
async function requestMicrophone(audio=true){
 const N=window.XChatNative;
 if(N&&typeof N.requestMicrophone==='function'){
  const state=await N.requestMicrophone();
  if(state===false||state==='denied')throw new Error('permission-denied');
  if(state==='blocked')throw new Error('permission-blocked');
 }
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('unsupported');
 try{
  return await navigator.mediaDevices.getUserMedia({audio,video:false});
 }catch(e){
  const n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError')throw new Error('permission-denied');
  if(n==='NotFoundError')throw new Error('no-microphone');
  throw e;
 }
}
function micErrorText(e){
 const m=e&&e.message;
 if(m==='permission-blocked')return 'Microphone access is blocked. Turn it on for XChat in your phone settings.';
 if(m==='permission-denied')return 'XChat needs your microphone to make calls. Allow it when your phone asks.';
 if(m==='no-microphone')return 'No microphone was found on this device.';
 if(m==='unsupported')return 'Audio calling is not supported on this device.';
 return 'The call could not start. Please try again.';
}
async function createCallPeer(peerId,callId){
 const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]});
 const stream=await requestMicrophone({echoCancellation:true,noiseSuppression:true,autoGainControl:true});
 stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 pc.onicecandidate=e=>{if(e.candidate)callSignal(peerId,'ice',{callId,candidate:e.candidate})};
 pc.ontrack=e=>{const a=$('#remote-audio');if(a){a.srcObject=e.streams[0];a.play().catch(()=>{})}startCallTimer()};
 pc.oniceconnectionstatechange=()=>{const s2=pc.iceConnectionState;if(s2==='connected'||s2==='completed')startCallTimer()};
 pc.onconnectionstatechange=()=>{
  const st=pc.connectionState;
  if(st==='connected'||st==='completed')startCallTimer();
  else if(st==='connecting')callState('Connecting…');
  if(['failed','closed','disconnected'].includes(st)){if(st==='failed')toast('Call connection lost.');endCall(false)}
 };
 return {pc,stream};
}
async function startAudioCall(peer){
 if(CALL)return toast('A call is already active.');
 if(!navigator.mediaDevices||!window.RTCPeerConnection)return toast('Audio calling is not supported on this device.');
 const callId=crypto.randomUUID();
 callScreen(peer,false);
 try{
  const media=await createCallPeer(peer.id,callId);
  CALL={id:callId,peer:peer.id,...media,muted:false,outgoing:true,pendingIce:[]};
  const offer=await CALL.pc.createOffer();
  await CALL.pc.setLocalDescription(offer);
  callSignal(peer.id,'offer',{callId,description:offer});
  callState('Ringing…');startRing(false);
  CALLTO=setTimeout(()=>{if(CALL&&!CALL.started){toast('No answer');endCall(true)}},45000);
 }catch(e){console.error('outgoing call failed',e);endCall(false);toast(micErrorText(e),3200)}
}
async function handleCallSignal(sig){
 if(sig.kind==='offer'){
  if(CALL){callSignal(sig.from,'busy',{callId:sig.callId});return}
  await fetchProfiles([sig.from]);
  const peer=person(sig.from), d=callScreen(peer,true);
  CALL={id:sig.callId,peer:sig.from,pendingOffer:sig.description,pendingIce:[],muted:false};
  startRing(true);
  CALLTO=setTimeout(()=>{if(CALL&&!CALL.started)endCall(true)},45000);
  $('#accept',d).onclick=async()=>{
   stopRing();callState('Connecting…');
   try{
    const media=await createCallPeer(sig.from,sig.callId);
    Object.assign(CALL,media);
    await CALL.pc.setRemoteDescription(sig.description);
    for(const ice of CALL.pendingIce){try{await CALL.pc.addIceCandidate(ice)}catch(e){}}
    CALL.pendingIce=[];
    const answer=await CALL.pc.createAnswer();
    await CALL.pc.setLocalDescription(answer);
    callSignal(sig.from,'answer',{callId:sig.callId,description:answer});
    drawCallActions(false);
   }catch(e){console.error('answer failed',e);endCall(true);toast(micErrorText(e),3200)}
  };
  return;
 }
 if(!CALL||sig.callId!==CALL.id)return;
 if(sig.kind==='answer'&&CALL.pc){stopRing();try{await CALL.pc.setRemoteDescription(sig.description)}catch(e){}
  for(const ice of (CALL.pendingIce||[])){try{await CALL.pc.addIceCandidate(ice)}catch(e){}}
  if(CALL)CALL.pendingIce=[];callState('Connecting…')}
 else if(sig.kind==='ice'){if(CALL.pc&&CALL.pc.remoteDescription){try{await CALL.pc.addIceCandidate(sig.candidate)}catch(e){}}else CALL.pendingIce&&CALL.pendingIce.push(sig.candidate)}
 else if(sig.kind==='hangup'||sig.kind==='busy'){toast(sig.kind==='busy'?'User is on another call.':(CALL.started?'Call ended':'Call declined'));endCall(false)}
}
function endCall(notify){
 stopRing();clearTimeout(CALLTO);
 if(!CALL){const el=$('#call-screen');if(el)el.remove();return}
 const c=CALL;CALL=null;
 if(c._timer)clearInterval(c._timer);
 if(notify)callSignal(c.peer,'hangup',{callId:c.id});
 if(c.pc)try{c.pc.close()}catch(e){}
 if(c.stream)c.stream.getTracks().forEach(t=>t.stop());
 const d=$('#call-screen');if(d){d.style.animation='fade .18s reverse both';setTimeout(()=>d.remove(),170)}
}

 /* --- render --- */
 function visible(){return chat.msgs.filter(m=>!m.hiddenForMe)}

 }
 function drawMsgs(keep){
  const prevH=M.scrollHeight, prevTop=M.scrollTop, wasBottom=bottomNow();
  const all=visible(), list=all.slice(Math.max(0,all.length-shown));
  let last='';

   const d=dayLabel(msg.t);

  });

 /* Uploads the real bytes with true progress, pausing while the phone has no
    usable connection and continuing automatically once it is back. */
 async function transferUp(msg,file,ext){
  msg._file=file;
  const path=msg.pendingPath||(chat.conv+'/'+ME.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext);
  msg.pendingPath=path;
  let tries=0;
  for(;;){
   if(!Net.online){msg.paused=true;drawMsgs(true);await Net.waitOnline();msg.paused=false;drawMsgs(true)}
   try{
    msg.up=Math.max(Number(msg.up)||1,1);drawSoon();
    await Transfer.upload('media',path,file,p=>{msg.up=p;drawSoon()},msg);
    msg.up=100;msg.paused=false;drawMsgs(true);
    // Keep the bytes we already have under the final path: the bubble never
    // re-fetches a signed URL, so the photo never blinks after sending.
    MEDIA.save('media',path,file);
    return path;
   }catch(e){
    if(!Net.online){msg.up=Math.min(Number(msg.up)||1,95);continue}
    if(++tries>=4){msg.st='failed';msg.paused=false;drawMsgs(true);toast('Upload failed. Tap Retry on the message.');return null}
    await sleep(Math.min(8000,700*Math.pow(2,tries)));
   }
  }

    const out=await B.openFile(rec.name,rec.mime,b64);

  rec.start();
  $('#recslot',v).innerHTML=`<div class="reccard"><span class="recdot"></span>
    <span id="rt" style="font-weight:700;min-width:44px">0:00</span>
    <div class="wave" id="rw" style="flex:1;color:var(--a)"></div>
    <button class="press" id="rc" style="color:var(--bad);font-weight:700">Cancel</button>
    <button class="sendbtn" id="rs" style="width:42px;height:42px">${I.send}</button></div>`;
  recTimer=setInterval(()=>{
   an.getByteFrequencyData(buf);
   const lvl=Math.min(1,(buf.reduce((a,b)=>a+b,0)/buf.length)/110);
   recWave.push(lvl);if(recWave.length>34)recWave.shift();
   const rw=$('#rw',v);if(rw)rw.innerHTML=recWave.map(h=>`<i class="on" style="height:${Math.max(12,h*100)}%"></i>`).join('');
   const rt=$('#rt',v);if(rt)rt.textContent=mmss((Date.now()-recStart)/1000);
  },110);
  $('#rc',v).onclick=()=>stopRecording(false,ac);
  $('#rs',v).onclick=()=>stopRecording(true,ac);
  buzz(20);
 }
 function stopRecording(keep,ac){
  clearInterval(recTimer);
  const wave=recWave.length?[...recWave]:Array.from({length:26},()=>Math.random()*.8+.2);
  rec.onstop=async()=>{
   recStream.getTracks().forEach(t=>t.stop());ac&&ac.close&&ac.close();
   $('#recslot',v).innerHTML='';
   if(!keep)return;
   const blob=new Blob(recChunks,{type:rec.mimeType||'audio/webm'});
   const url=URL.createObjectURL(blob);
   const dur=await realDuration(url,(Date.now()-recStart)/1000);
   const msg={id:'tmp'+uid('m'),clientId:crypto.randomUUID(),from:'me',type:'voice',src:url,dur,wave:sampleWave(wave,26),t:Date.now(),st:'sending',reply:replyTo};
   clearReply();chat.msgs.push(msg);drawMsgs();M.scrollTop=M.scrollHeight;
   const path=await uploadMedia(chat.conv,blob,(blob.type.includes('mp4')?'mp4':'webm'));
   if(!path){msg.st='failed';drawMsgs(true);return}
   msg.path=path;deliver(msg);
  };
  rec.stop();
 }
 function sampleWave(w,n){const out=[];for(let i=0;i<n;i++)out.push(w[Math.floor(i*w.length/n)]||.3);return out}
 function realDuration(url,fallback){
  return new Promise(res=>{
   const a=new Audio();a.preload='metadata';a.src=url;
   const done=d=>res(isFinite(d)&&d>0?d:fallback);
   a.onloadedmetadata=()=>{
    if(a.duration===Infinity){a.currentTime=1e101;a.ontimeupdate=()=>{a.ontimeupdate=null;done(a.duration);a.currentTime=0}}
    else done(a.duration);
   };
   a.onerror=()=>res(fallback);
   setTimeout(()=>res(fallback),1800);
  });
 }

 /* --- voice playback (accurate 1:1) --- */
 function playVoice(msg){
  if(activeAudio&&activeAudio.msgId!==msg.id)stopVoice();
  if(!activeAudio||activeAudio.msgId!==msg.id){
   const a=new Audio(msg.src);a.msgId=msg.id;activeAudio=a;
   a.ontimeupdate=()=>paintVoice(msg,a.currentTime,msg.dur);
   a.onended=()=>{paintVoice(msg,0,msg.dur);setBtn(msg,false);activeAudio=null};
   a.play();setBtn(msg,true);return;
  }
  if(activeAudio.paused){activeAudio.play();setBtn(msg,true)}
  else{activeAudio.pause();setBtn(msg,false)}
 }
 function seekVoice(msg,frac){
  if(!activeAudio||activeAudio.msgId!==msg.id)playVoice(msg);
  if(activeAudio&&isFinite(msg.dur)){activeAudio.currentTime=Math.max(0,Math.min(msg.dur,frac*msg.dur));paintVoice(msg,activeAudio.currentTime,msg.dur)}
 }
 function setBtn(msg,playing){
  const b=$(`[data-vp="${msg.id}"]`,M);if(!b)return;
  b.innerHTML=playing?I.pause(msg.from==='me'?'#fff':'var(--a)'):I.play(msg.from==='me'?'#fff':'var(--a)');
 }
 function paintVoice(msg,cur,dur){
  const w=$(`[data-wave="${msg.id}"]`,M),tm=$(`[data-vt="${msg.id}"]`,M);
  if(tm)tm.textContent=mmss(cur)+' / '+mmss(dur);
  if(w){const bars=[...w.children],k=Math.round((cur/(dur||1))*bars.length);bars.forEach((b,i)=>b.classList.toggle('on',i<k))}
 }
 function stopVoice(){if(activeAudio){activeAudio.pause();const id=activeAudio.msgId;activeAudio=null;const b=$(`[data-vp="${id}"]`,M);if(b)b.innerHTML=I.play('var(--a)')}}

 /* --- media viewer --- */
 function viewer(msg){
  const d=document.createElement('div');d.className='viewer';
  d.innerHTML=`<div style="display:flex;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 12px) 16px 0"><button class="iconbtn press" style="background:rgba(255,255,255,.12);color:#fff;box-shadow:none">${I.close}</button></div>
   <div class="vb">${msg.type==='image'?`<img src="${srcAttr(msg.src)}">`:`<video src="${srcAttr(msg.src)}" controls autoplay></video>`}</div>
   ${msg.text?`<div style="color:#fff;padding:0 20px 26px;text-align:center;font-size:14px">${esc(msg.text)}</div>`:''}`;
  d.querySelector('button').onclick=()=>d.remove();
  app.appendChild(d);
 }

 drawMsgs();
}

/* ---- animated splash: shows on open, fades out into the live app ---- */
const SPLASH={el:document.getElementById('splash'),done:false,start:Date.now()};
function hideSplash(){
 if(!SPLASH.el||SPLASH.done)return;SPLASH.done=true;
 SPLASH.el.classList.add('gone');
 setTimeout(()=>{try{SPLASH.el.remove()}catch(_){}},420);
}
(function playSplash(){
 if(!SPLASH.el)return;
 const fb=()=>SPLASH.el.classList.add('fallback');
 const go=()=>{
  try{
   if(!window.lottie)return fb();
   const anim=window.lottie.loadAnimation({container:document.getElementById('splashAnim'),
    renderer:'svg',loop:false,autoplay:true,path:'/splash.json',
    rendererSettings:{preserveAspectRatio:'xMidYMid slice'}});
   anim.addEventListener('data_failed',fb);
   anim.addEventListener('complete',hideSplash);
  }catch(e){fb()}
 };
 if(window.lottie)go();else window.addEventListener('load',()=>setTimeout(go,0),{once:true});
 // hard safety net: never trap the user behind the splash
 setTimeout(hideSplash,2600);
})();

(async()=>{
 try{await bootSession()}catch(e){console.error(e)}
 render();
 // The native splash stays up until the first real frame is on screen, so the
 // app never flashes a blank white page on launch.
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  try{window.dispatchEvent(new Event('xchat-ui-ready'))}catch(_){}
 }));
 initNotifications();
})();

/* ---- Android/browser back button closes the open screen instead of leaving ---- */

window.addEventListener('popstate',()=>{
 const sh=document.querySelector('.sheet-wrap,.sheet');
 let handled=false;
 if(sh){const c=sh.querySelector('[data-close]');(c?c.click():sh.remove());handled=true}
 else if(S.openChat){S.openChat=null;render();handled=true}

 else{try{if(window.XChatNative&&XChatNative.exitApp)XChatNative.exitApp();else history.pushState({x:1},'')}catch(_){}}
});
if('serviceWorker' in navigator){
 navigator.serviceWorker.addEventListener('message',e=>{

}

});

 }
});

/* ---- On-screen keyboard: shrink the app to the visible area so the composer
       never hides behind the keyboard on Android/iOS wrappers. ---- */
(function(){
 const vv=window.visualViewport;if(!vv)return;
 const app=document.getElementById('app');if(!app)return;
 let raf=0;
 const apply=()=>{
  raf=0;
  const hidden=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
  const open=hidden>120;
  app.style.height=open?vv.height+'px':'';
  document.body.classList.toggle('kb-open',open);
  if(open){const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight}
 };
 const schedule=()=>{if(!raf)raf=requestAnimationFrame(apply)};
 vv.addEventListener('resize',schedule);
 vv.addEventListener('scroll',schedule);
})();
